{% extends 'base.html' %}
{% block title %}Log in · NutriTrack{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand">
    <span class="brand-mark brand-mark-lg">&#127807;</span>
    <h1>NutriTrack</h1>
    <p class="auth-subtitle">Track your Indian meals, the smart way.</p>
  </div>

  <h2 class="auth-heading">Welcome back</h2>
  <form method="post" class="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>

    <button type="submit" class="btn btn-primary btn-block">Log In</button>
  </form>

  <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
</div>
{% endblock %}
