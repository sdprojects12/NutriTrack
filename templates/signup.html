{% extends 'base.html' %}
{% block title %}Sign up · NutriTrack{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand">
    <span class="brand-mark">NT</span>
    <h1>NutriTrack</h1>
    <p class="auth-subtitle">Track your Indian meals, the smart way.</p>
  </div>

  <h2 class="auth-heading">Create your account</h2>
  <form method="post" class="auth-form">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" placeholder="Priya Sharma" required autofocus>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required minlength="6">

    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
